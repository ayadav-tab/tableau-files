<!DOCTYPE html>
<html>

<head>
  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script src="tableau.extensions.1.latest.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="script.js"></script>
  <style>
    @font-face {
      font-family: 'Noto Sans';
      src: url('./fonts/NotoSans-Regular.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
    }

    body {

      padding: 10px;
    }

    table {
      border-collapse: collapse;
      min-width: 100%;
      width: max-content;
      font-family: 'Noto Sans';
      font-size: 13px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    .link {
      color: blue;
      cursor: pointer;
      text-decoration: underline;
    }

    .table-container {
      height: 76vh;
      overflow: auto;
      overflow-x: auto;
      width: 100%;
    }

    tr {
      color: #0a1157;
    }


    th,
    td {
      border: 1px solid #ddd;
      padding: 6px;
      max-width: 700px;
      white-space: nowrap;
      /* Prevents text wrapping */
      overflow: hidden;
      /* Hides the text that doesn't fit */
      text-overflow: ellipsis;
      /* Adds the '...' at the cutoff point */

    }

    th {
      cursor: pointer;
      background: #0a1157;
      position: sticky;
      top: 0;
      z-index: 2;
      color: white;
      font-weight: 400;
      max-width: 500px;
    }

    tr:hover {
      background: #f1f1f1;
    }

    .sort-icon {
      font-size: 10px;
      margin-left: 6px;
      opacity: 0.6;
    }

    th:hover .sort-icon {
      opacity: 1;
    }

    #excelexport {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      padding-top: 0px !important;
    }

    #excelexport img {
      width: 22px;
      height: 22px;
    }

    #excelexport:hover {
      background: #f3f3f3;
    }

    .sheetname {
      font-family: 'Noto Sans';
      font-size: 16px;
      color: #0a1157;
      font-weight: 600;
    }

    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #ddd;
      border-top: 5px solid #0a1157;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {

      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }

    }
    .grand-total-row {
    text-align: right;
    font-weight: 600;
    border: 1px solid #ddd;
    padding: 6px;
    max-width: 700px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.grand-total-row td {
    padding: 8px;
}
  </style>
  </style>
</head>

<body>
  <div>
    <span class="sheetname"></span>
    <button id="configure">Configure</button>
    <button style="float: right;" id="csvexport" title="Export to CSV">
      <img src="Images/csv.png" alt="CSV Export">
    </button>
    <button style="float: right;" id="excelexport" title="Export to Excel">
      <img src="Images/excel.png" alt="Excel Export">
    </button>
  </div>
  <br>
  <div class="table-container">
    <div id="loader">
      <div class="spinner"></div>
    </div>
    <table id="dataTable">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
</body>

</html>
